name: bai8

services:
  redis:
    image: redis:7-alpine
    # Bat AOF nhu moi truong that: sau khi restart Redis nap lai du lieu co the da cu,
    # ung dung KHONG tin du lieu do ma dung run_id de phat hien va dung lai tu DB
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopfast
      POSTGRES_PASSWORD: shopfast
      POSTGRES_DB: inventory
    ports:
      - "127.0.0.1:5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfast -d inventory"]
      interval: 2s
      retries: 15
